apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: wallet-platform
    includeSelectors: false

images:
  - name: wallet
    newName: ghcr.io/eriksonwilliam/go-wallet-pix
    # Tag imutavel, a mesma do appVersion do chart Helm. `latest` impede
    # rollback auditavel e deixa pods do mesmo Deployment com codigo diferente.
    newTag: "0.1.0"
