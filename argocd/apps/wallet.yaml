apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wallet
  namespace: argocd
  annotations:
    # Depois da observabilidade: o ServiceMonitor depende do CRD dela.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: wallet
  source:
    repoURL: https://github.com/eriksonwilliam/k8s-gitops-platform.git
    targetRevision: main
    path: charts/wallet
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: wallet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Se o CRD ainda nao existir (primeira instalacao), tenta de novo em vez
    # de ficar em erro ate um sync manual.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
