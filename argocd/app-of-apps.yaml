apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Projeto minimo: so Applications e AppProjects no namespace argocd.
  project: bootstrap
  source:
    repoURL: https://github.com/eriksonwilliam/k8s-gitops-platform.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Sem prune na raiz: tirar uma Application do Git nao apaga, sozinho, a
      # aplicacao e (pelo finalizer) todos os recursos dela. Remover exige
      # sync manual com prune, uma decisao explicita.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
