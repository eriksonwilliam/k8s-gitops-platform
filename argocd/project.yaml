apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Plataforma GitOps (wallet + observabilidade)
  sourceRepos:
    - https://github.com/eriksonwilliam/k8s-gitops-platform.git
    - https://prometheus-community.github.io/helm-charts
  # Namespaces explicitos em vez de "*": argocd (app-of-apps), observability
  # e kube-system, onde o kube-prometheus-stack cria os Services de scrape
  # de coredns, kube-controller-manager e afins.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
