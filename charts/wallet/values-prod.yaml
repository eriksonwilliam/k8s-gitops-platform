replicaCount: 3

image:
  # go-wallet-pix 0.2.0 (tag git v0.2.0, commit 9718ce2). Digest do indice OCI
  # publicado no GHCR pelo workflow "Imagem" (run 45881658848).
  digest: sha256:1bbe1dd6ef673bcfd5a305f6c74aed411c6f89cf948762c382d55a861b3d6387

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: wallet.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wallet-tls
      hosts:
        - wallet.example.com

serviceMonitor:
  enabled: true

podDisruptionBudget:
  enabled: true

networkPolicy:
  enabled: true
