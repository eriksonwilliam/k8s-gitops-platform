replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: wallet.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wallet-tls
      hosts:
        - wallet.example.com

serviceMonitor:
  enabled: true
