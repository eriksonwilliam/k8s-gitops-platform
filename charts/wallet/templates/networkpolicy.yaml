{{- if .Values.networkPolicy.enabled }}
# Entrada so do ingress controller e do Prometheus; nenhuma saida alem de DNS.
# O servico nao chama nada fora do proprio processo (PIX e simulado), entao
# qualquer conexao de saida seria anomalia.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wallet.fullname" . }}
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wallet.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
