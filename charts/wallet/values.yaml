replicaCount: 2

image:
  repository: ghcr.io/eriksonwilliam/go-wallet-pix
  # tag vazio usa o appVersion do Chart
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # O servico nao fala com a API do Kubernetes; montar o token so aumentaria
  # o que um processo comprometido consegue fazer no cluster.
  automountToken: false

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

containerPort: 3000

env:
  PORT: "3000"

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: wallet.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ServiceMonitor (Prometheus Operator). O go-wallet-pix expoe /metrics a partir
# do PR que adicionou o endpoint; a imagem usada precisa ser dessa versao em
# diante, senao o alvo fica permanentemente "down". Requer o CRD do operator.
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

probes:
  path: /health

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Requer um CNI que aplique NetworkPolicy (Calico, Cilium; o kindnet do kind
# v0.27 tambem aplica). Com um CNI que nao aplica, o objeto e aceito e ignorado.
networkPolicy:
  enabled: false
  allowedNamespaces:
    - ingress-nginx
    - observability
