replicaCount: 1

# Sem `latest`: tag mutavel faz dois pods do mesmo Deployment rodarem codigo
# diferente e torna o rollback impossivel de auditar. Dev usa o appVersion do
# chart, como prod; para testar outra imagem, sobrescreva image.tag.

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: wallet.dev.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    cpu: 100m
    memory: 64Mi
